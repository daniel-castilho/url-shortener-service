name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Run unit tests
        run: ./mvnw test
      - name: Architecture boundary check
        run: bash scripts/check-boundaries.sh
      - name: Boundary gate self-test
        run: bash scripts/check-boundaries.sh --self-test
      - name: Documentation sync check
        run: bash scripts/check-doc-sync.sh
      - name: Doc-sync gate self-test
        run: bash scripts/check-doc-sync.sh --self-test
      # Living specifications: >= 90% of declared EARS requirements in spec-complete
      # package-info.java components are traced via @TracesRequirement (single source of truth).
      - name: Living-spec traceability gate
        run: bash scripts/check-living-spec.sh
      - name: Living-spec gate self-test
        run: bash scripts/check-living-spec.sh --self-test

  observability:
    name: Observability Gate (Epic 3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pinned promtool (Prometheus 3.3.0) and amtool (Alertmanager 0.28.1) — pinned so a
      # Prometheus release can never silently change the rule/config grammar we validate against.
      - name: Download pinned promtool
        run: |
          curl -sL -o /tmp/prom.tar.gz https://github.com/prometheus/prometheus/releases/download/v3.3.0/prometheus-3.3.0.linux-amd64.tar.gz
          tar xzf /tmp/prom.tar.gz -C /tmp
          echo "/tmp/prometheus-3.3.0.linux-amd64" >> "$GITHUB_PATH"
      - name: Download pinned amtool
        run: |
          curl -sL -o /tmp/am.tar.gz https://github.com/prometheus/alertmanager/releases/download/v0.28.1/alertmanager-0.28.1.linux-amd64.tar.gz
          tar xzf /tmp/am.tar.gz -C /tmp
          echo "/tmp/alertmanager-0.28.1.linux-amd64" >> "$GITHUB_PATH"
      - name: Tool versions
        run: promtool --version | head -1 && amtool --version | head -1
      # Epic 3 story 3.4: burn-rate rules must load and the triggered behaviour is pinned by tests.
      - name: promtool check rules (syntax + expression)
        run: promtool check rules deploy/monitoring/alerts.yml deploy/monitoring/recording-rules.yml
      - name: promtool test rules (fast/slow burn fire; healthy traffic silent)
        run: promtool test rules deploy/monitoring/rules_tests.yml
      - name: promtool check config
        run: promtool check config deploy/monitoring/prometheus.yml
      - name: amtool check-config
        run: amtool check-config deploy/monitoring/alertmanager.yml
      # Epic 3 story 3.2: registered Micrometer meters are a frozen contract (docs/slos.md §2).
      - name: Metrics freeze gate
        run: bash scripts/check-metrics-frozen.sh
      - name: Metrics freeze gate self-test
        run: bash scripts/check-metrics-frozen.sh --self-test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      # OWASP dependency-check is bound to the verify phase; prime the NVD data cache so this
      # verify hit (and the dedicated security-check job) runs a delta sync, not a cold one.
      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: owasp-nvd-v1
          restore-keys: owasp-nvd-
      - name: Run integration tests
        run: ./mvnw verify -DfailIfNoTests=false -DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz

  security-check:
    name: Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/dependency-check-data
          key: owasp-nvd-v1
          restore-keys: owasp-nvd-
      - name: Static security gate
        run: bash scripts/check-security.sh
      - name: Static security gate self-test
        run: bash scripts/check-security.sh --self-test
      # Epic 2 story 2.5: the plugin consumes the ODC nightly NVD mirror (DependencyCheck_Builder)
      # via nvdDatafeedUrl — NVD API cold syncs were stuck >1h in CI (2026-09-11, keyed AND keyless),
      # the mirror cold-syncs in ~2min (verified locally). The NVD_API_KEY secret is kept in the org
      # for optional manual keyed API use but is intentionally NOT wired here. A tool outage fails
      # the job — never silent-pass (2 retries, then fail).
      - name: OWASP Dependency-Check (NVD mirror, cached)
        run: |
          set -euo pipefail
          FEED='-DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz'
          attempt() { ./mvnw -B dependency-check:check -DskipTests "$FEED" "$@"; }
          if ! attempt; then
            echo "OWASP attempt 1 failed — retrying once in 60s (NVD sync flakiness, documented P2 policy)"
            sleep 60
            attempt || { echo "OWASP attempt 2 failed — FAILING THE JOB (never silent-pass)"; exit 1; }
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build jar
        run: ./mvnw clean package -DskipTests
