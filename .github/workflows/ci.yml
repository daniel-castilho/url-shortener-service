name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run unit tests
        run: mvn test
      - name: Architecture boundary check
        run: |
          VIOLATIONS=$(grep -rEn "import ca\.tyny\.urlshortener\.infra" src/main/java/ca/tyny/urlshortener/core || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: core/ imports infra:"
            echo "$VIOLATIONS"
            exit 1
          fi
          FRAMEWORK=$(grep -rlE "org\.springframework|org\.mongodb|org\.redisson|io\.jsonwebtoken|io\.micrometer" src/main/java/ca/tyny/urlshortener/core || true)
          if [ -n "$FRAMEWORK" ]; then
            echo "ERROR: core/ imports framework types:"
            echo "$FRAMEWORK"
            exit 1
          fi
          echo "Architecture boundary check passed."

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Run integration tests
        run: mvn verify -DfailIfNoTests=false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build jar
        run: mvn clean package -DskipTests
