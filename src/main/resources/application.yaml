server:
  undertow:
    threads:
      io: 16           # I/O threads (Usually cores * 2)
      worker: 200      # Worker threads (Virtual threads handle the heavy load)
    buffer-size: 1024  # Direct buffer optimization
    direct-buffers: true

spring:
  application:
    name: url-shortener-native
  threads:
    virtual:
      enabled: true  # Enables Virtual Threads across the container (Undertow)
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/url_shortener}
      auto-index-creation: false
      connect-timeout: 10000ms
      socket-timeout: 30000ms
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 500ms

# ========================================
# Application Configuration
# ========================================
app:
  shortener:
    code-length: ${SHORTENER_CODE_LENGTH:7}
    # salt: removed (SHORTENER_SALT no longer used once Hashids is dropped)
  url:
    allow-http: false              # Reject http:// URLs (HTTPS-only by default)
    dns-timeout-ms: 2000           # DNS resolution timeout
    block-private-ips: true        # Block RFC1918, loopback, link-local, metadata IPs
    dns-cache-ttl-seconds: 300     # Cache successful DNS resolutions
  
  jwt:
    # CRITICAL: MUST be set via environment variable in production
    # Minimum 32 characters required for HS256
    # Example: export APP_JWT_SECRET="your-super-secret-key-at-least-32-chars-long"
    secret: ${APP_JWT_SECRET:9a4f2c8d3b7a1e6f4c5d8e9a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c}
    
    # Token expiration times
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}        # 24 hours (in milliseconds)
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}  # 7 days (in milliseconds)

# ========================================
# Observability & Monitoring
# ========================================
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus, circuitbreakers
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      show-components: always
  health:
    circuitbreakers:
      enabled: true

# ========================================
# Rate Limiting
# ========================================
rate-limiter:
  enabled: true       # Master switch; when false nothing touches Redis
  limit: 60           # SHORTEN scope: max requests per window (bucket capacity)
  window: PT1M        # SHORTEN scope: full refill time (ISO-8601 Duration)
  redirect-limit: 120 # REDIRECT scope: bucket capacity for GET /{id} (anti-enumeration)
  redirect-window: PT1M
  client-ip-header: X-Forwarded-For  # Trusted only from trusted-proxy-cidrs peers
  trusted-proxy-cidrs:              # Peers allowed to set the client-ip-header
    - 127.0.0.0/8
    - ::1/128

# ========================================
# Resilience4j Circuit Breakers
# ========================================
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
    instances:
      rateLimiterCb:
        baseConfig: default
        failureRateThreshold: 40
        waitDurationInOpenState: 10s
      databaseCb:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
