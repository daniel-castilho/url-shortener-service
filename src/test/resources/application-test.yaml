spring:
  mongodb:
    uri: mongodb://localhost:27017/url_shortener_test
    auto-index-creation: true
    connect-timeout: 5000ms
    socket-timeout: 15000ms
    server-selection-timeout: 5000ms
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms

app:
  shortener:
    salt: "test-salt"
  jwt:
    secret: "test-secret-key-at-least-32-characters-long-for-testing"
    expiration-ms: 86400000
    refresh-expiration-ms: 604800000
  domain:
    default-host: localhost
    dns-verify-enabled: false
    dns-verify-cron: 0 */5 * * * *
    dns-verify-timeout-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
    instances:
      databaseCb:
        baseConfig: default
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
      rateLimiterCb:
        baseConfig: default
        failureRateThreshold: 40

