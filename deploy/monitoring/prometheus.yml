global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - recording-rules.yml
  - alerts.yml

scrape_configs:
  - job_name: url-shortener
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["${URL_SHORTENER_HOST:localhost:8080}"]
        labels:
          application: url-shortener
          environment: ${SPRING_PROFILES_ACTIVE:dev}