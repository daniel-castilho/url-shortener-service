# Prometheus config for the deploy host (ADR 0012, Epic 25).
#
# Scrapes the two blue/green app instances as SEPARATE per-color jobs so the canary
# gate (scripts/canary-gate.sh) can evaluate one color independently of the other:
#   url-shortener-blue  -> 127.0.0.1:8080  (labels: color=blue)
#   url-shortener-green -> 127.0.0.1:8081  (labels: color=green)
# scrape_interval 15s yields >= 6 samples across a 90s gate window.
#
# Scrape authentication (ADR 0012 D4): the existing Operator BasicAuth account
# (OPERATOR_USERNAME/OPERATOR_PASSWORD -> app.security.operator.*). The username is
# env-fed (Prometheus expands ${PROM_SCRAPE_USERNAME} at startup); the password NEVER
# appears here or in any command line — it lives in a root-owned 0600 file referenced
# via `password_file`. Rotation = replace the file + systemctl reload.
#
# installed/generated by scripts/install-prometheus.sh --install into
# /etc/prometheus/prometheus.yml (this file is the git-owned source of truth and is
# NOT executed by CI — promtool CI checks this same file where placeholders are
# harmless: promtool does not expand ${VAR} in check-config, but the runtime
# Prometheus does, so the rules/alerting targets stay concrete here).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - recording-rules.yml
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

scrape_configs:
  - job_name: url-shortener-blue
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    honor_labels: false
    basic_auth:
      username: ${PROM_SCRAPE_USERNAME}
      password_file: ${PROM_SCRAPE_PASSWORD_FILE}
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          application: url-shortener
          environment: prod
          color: blue

  - job_name: url-shortener-green
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    honor_labels: false
    basic_auth:
      username: ${PROM_SCRAPE_USERNAME}
      password_file: ${PROM_SCRAPE_PASSWORD_FILE}
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels:
          application: url-shortener
          environment: prod
          color: green