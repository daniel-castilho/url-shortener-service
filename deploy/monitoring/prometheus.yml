# Prometheus config for the deploy host (ADR 0012, Epic 25).
#
# Scrapes the two blue/green app instances as SEPARATE per-color jobs so the canary
# gate (scripts/canary-gate.sh) can evaluate one color independently of the other:
#   url-shortener-blue  -> 127.0.0.1:8080  (labels: color=blue)
#   url-shortener-green -> 127.0.0.1:8081  (labels: color=green)
# scrape_interval 15s yields >= 6 samples across a 90s gate window.
#
# Scrape authentication (ADR 0012 D4): the existing Operator BasicAuth account
# (OPERATOR_USERNAME/OPERATOR_PASSWORD -> app.security.operator.*). The username is
# env-fed: the installer renders the git-owned template with concrete values via
# scripts/install-prometheus.sh --render-config, producing /etc/prometheus/prometheus.yml
# with no ${VAR} placeholders left. Prometheus does not expand environment variables
# in basic_auth.username or password_file (only external_labels support ${VAR}); the
# rendered config is validated with promtool check config before installation.
# Rotation = replace the password file + systemctl reload.
#
# installed/generated by scripts/install-prometheus.sh --install (or --render-config)
# into /etc/prometheus/prometheus.yml.  The repo template contains render tokens
# ${PROM_SCRAPE_USERNAME}, ${PROM_SCRAPE_PASSWORD_FILE}, ${PROM_ENVIRONMENT} that are
# substituted at install time; the rendered config is the form accepted by the runtime
# Prometheus and by promtool check config.
#
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - recording-rules.yml
  - alerts.yml

scrape_configs:
  - job_name: url-shortener-blue
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    honor_labels: false
    basic_auth:
      username: ${PROM_SCRAPE_USERNAME}
      password_file: ${PROM_SCRAPE_PASSWORD_FILE}
    static_configs:
      - targets: ["127.0.0.1:8080"]
        labels:
          application: url-shortener
          environment: ${PROM_ENVIRONMENT}
          color: blue

  - job_name: url-shortener-green
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    honor_labels: false
    basic_auth:
      username: ${PROM_SCRAPE_USERNAME}
      password_file: ${PROM_SCRAPE_PASSWORD_FILE}
    static_configs:
      - targets: ["127.0.0.1:8081"]
        labels:
          application: url-shortener
          environment: ${PROM_ENVIRONMENT}
          color: green